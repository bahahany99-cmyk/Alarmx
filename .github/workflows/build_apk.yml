name: Build Android Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Gradle wrapper (gradlew, gradlew.bat, gradle-wrapper.jar) and
      # local.properties are intentionally git-ignored by the Flutter template, so a
      # fresh checkout is missing the Android bootstrap files the build needs.
      # `flutter create` regenerates them in place.
      - name: Restore missing Android bootstrap files
        run: flutter create --platforms=android .

      # `flutter create` also re-renders template files that are tracked in git
      # (AndroidManifest.xml, build.gradle.kts, MainActivity.kt, ...). Restore the
      # committed versions so the project's own configuration — including the
      # androidx.core:core-ktx dependency and the alarm permissions — always wins.
      # Untracked files generated above (the Gradle wrapper) are kept.
      - name: Restore committed project files
        run: |
          git checkout -- .
          git status --short

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      # Workflow logs are not always reachable from every environment, so mirror the
      # tail of a failed build into job annotations, which are available via the API.
      - name: Surface build log on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          try:
              lines = open('/tmp/build.log', errors='replace').read().splitlines()
          except OSError:
              lines = ['no /tmp/build.log produced']
          tail = lines[-250:]
          chunk, size = [], 0
          chunks = []
          for line in tail:
              if size + len(line) > 2500:
                  chunks.append(chunk); chunk, size = [], 0
              chunk.append(line); size += len(line) + 1
          if chunk:
              chunks.append(chunk)
          for i, c in enumerate(chunks[-8:]):
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title=build-log-{i}::{msg}')
          PY

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmx-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
