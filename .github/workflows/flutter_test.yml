name: Analyze and Test

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        # TEMP DIAGNOSTIC (Phase 3 hang hunt): bisect the suite file by
        # file, each probe bounded by GNU timeout so a wedged file yields
        # a TIMEOUT verdict instead of stalling. Reverted after diagnosis.
        run: |
          set -o pipefail
          run_probe() {
            # NOTE: GitHub runs steps with `bash -e`; the `||` keeps a
            # failing probe from aborting the remaining probes, and the
            # failure is recorded for the final verdict instead.
            name="$1"; shift
            echo "=== PROBE $name START ==="
            code=0
            timeout 300 flutter test --timeout 60s "$@" > "/tmp/probe_$name.log" 2>&1 || { code=$?; fail=1; }
            if [ $code -eq 124 ]; then echo "PROBE $name VERDICT: TIMEOUT-KILLED"; else echo "PROBE $name VERDICT: exit=$code"; fi
            if [ $code -eq 124 ]; then echo "--- $name killed-log tail (in-flight shards) ---"; tail -60 "/tmp/probe_$name.log"; else tail -8 "/tmp/probe_$name.log"; fi
            echo "=== PROBE $name END ==="
          }
          {
            fail=0
            run_probe S1-new-together test/core/l10n/ test/core/alarms/alarm_controller_test.dart test/features/ test/widget_test.dart
            run_probe S2-new-concurrency2 --concurrency=2 test/core/l10n/ test/core/alarms/alarm_controller_test.dart test/features/ test/widget_test.dart
            echo "ALL PROBES DONE, failures=$fail"
            test "$fail" -eq 0
          } 2>&1 | tee /tmp/test.log

      # Workflow logs are not always reachable from every environment, so mirror
      # failure output into job annotations, which are available via the API.
      - name: Surface logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os

          def read_tail(path, count=120):
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              return lines[-count:]

          chunks = []
          for name, path in (('analyze', '/tmp/analyze.log'),
                             ('test', '/tmp/test.log')):
              lines = read_tail(path)
              if not lines:
                  continue
              chunk, size = [], 0
              for line in lines:
                  if size + len(line) > 2500:
                      chunks.append((name, chunk)); chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append((name, chunk))

          if not chunks:
              print('::error title=no-logs::no analyze/test log was produced')
          for name, c in chunks[-10:]:
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title={name}-log::{msg}')
          PY
