name: Analyze and Test

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        # TEMP DIAGNOSTIC (Phase 3 hang hunt): bisect the suite file by
        # file, each probe bounded by GNU timeout so a wedged file yields
        # a TIMEOUT verdict instead of stalling. Reverted after diagnosis.
        run: |
          set -o pipefail
          run_probe() {
            # NOTE: GitHub runs steps with `bash -e`; the `||` keeps a
            # failing probe from aborting the remaining probes.
            name="$1"; shift
            echo "=== PROBE $name START ==="
            code=0
            timeout 180 flutter test --timeout 30s "$@" > "/tmp/probe_$name.log" 2>&1 || code=$?
            if [ $code -eq 124 ]; then echo "PROBE $name VERDICT: TIMEOUT-KILLED"; else echo "PROBE $name VERDICT: exit=$code"; fi
            tail -6 "/tmp/probe_$name.log"
            echo "=== PROBE $name END ==="
          }
          {
            run_probe P0-old-pure test/core/models/ test/core/scheduling/next_occurrence_calculator_test.dart
            run_probe P1-old-drift test/core/database/ test/core/scheduling/alarm_scheduling_coordinator_test.dart test/core/bootstrap/
            run_probe P2-new-strings test/core/l10n/
            run_probe P3-new-draft test/features/alarm_editor/alarm_draft_test.dart
            run_probe P4-new-formatters test/features/home/alarm_formatters_test.dart
            run_probe P5-new-controller test/core/alarms/alarm_controller_test.dart
            run_probe P6-new-home test/features/home/home_screen_test.dart
            run_probe P7-new-editor test/features/alarm_editor/alarm_editor_screen_test.dart
            run_probe P8-new-shell test/widget_test.dart
            run_probe P9-old-alarms test/core/alarms/
            echo "ALL PROBES DONE"
          } 2>&1 | tee /tmp/test.log

      # Workflow logs are not always reachable from every environment, so mirror
      # failure output into job annotations, which are available via the API.
      - name: Surface logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os

          def read_tail(path, count=120):
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              return lines[-count:]

          chunks = []
          for name, path in (('analyze', '/tmp/analyze.log'),
                             ('test', '/tmp/test.log')):
              lines = read_tail(path)
              if not lines:
                  continue
              chunk, size = [], 0
              for line in lines:
                  if size + len(line) > 2500:
                      chunks.append((name, chunk)); chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append((name, chunk))

          if not chunks:
              print('::error title=no-logs::no analyze/test log was produced')
          for name, c in chunks[-10:]:
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title={name}-log::{msg}')
          PY
