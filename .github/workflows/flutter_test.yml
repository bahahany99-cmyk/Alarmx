name: Analyze and Test

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        # NOTE: shards are capped at 2. The Phase 3 widget tests each pump a
        # full MaterialApp over a real in-memory Drift stack; at 4-way
        # parallelism the full suite wedges flakily mid-run. Widget tests
        # also dispose their tree and close their database in tearDown so no
        # live connections accumulate across the suite.
        run: |
          set -o pipefail
          flutter test --concurrency=2 2>&1 | tee /tmp/test.log
      # Workflow logs are not always reachable from every environment, so mirror
      # failure output into job annotations, which are available via the API.
      - name: Surface logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          # TEMP DIAGNOSTIC: pull failing-test lines out of the full log.
          probe = subprocess.run(
              ['grep', '-E', '-m', '80', r'\[E\]|Test failed|EXCEPTION|Expected:|Actual:|Which:',
               '/tmp/test.log'],
              capture_output=True, text=True, errors='replace')
          if probe.stdout.strip():
              msg = probe.stdout.strip().replace('%', '%25').replace('\n', '%0A')
              print(f'::error title=fail-lines::{msg[:4000]}')

          def read_tail(path, count=120):
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              return lines[-count:]

          chunks = []
          for name, path in (('analyze', '/tmp/analyze.log'),
                             ('test', '/tmp/test.log')):
              lines = read_tail(path)
              if not lines:
                  continue
              chunk, size = [], 0
              for line in lines:
                  if size + len(line) > 2500:
                      chunks.append((name, chunk)); chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append((name, chunk))

          if not chunks:
              print('::error title=no-logs::no analyze/test log was produced')
          for name, c in chunks[-10:]:
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title={name}-log::{msg}')
          PY
