name: Analyze and Test

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        # TEMP DIAGNOSTIC (Phase 3 hang hunt): JSON reporter + wall-clock
        # bound. testStart events without matching testDone name the
        # wedged tests; full completion at kill time proves a post-run
        # harness stall instead. Reverted after diagnosis.
        run: |
          set -o pipefail
          timeout 420 flutter test --concurrency=2 -r json > /tmp/json.log 2>&1 || code=$?
          code=${code:-0}
          echo "WALL-BOUND EXIT: $code (124 = still running at 7 min)"
          python3 - <<'PY' 2>&1 | tee /tmp/test.log
          import json
          starts, dones = {}, 0
          names = {}
          try:
              lines = open('/tmp/json.log', errors='replace').read().splitlines()
          except OSError:
              lines = []
          print(f'json lines: {len(lines)}')
          for line in lines:
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              t = e.get('type')
              if t == 'testStart':
                  test = e.get('test', {})
                  starts[test.get('id')] = test.get('name')
              elif t == 'testDone':
                  dones += 1
                  starts.pop(e.get('testID'), None)
          print(f'tests done: {dones}')
          print(f'tests started-but-unfinished: {len(starts)}')
          for tid, name in list(starts.items())[:15]:
              print(f'  UNFINISHED: {name}')
          print('--- raw tail ---')
          for line in lines[-12:]:
              print(line[:300])
          PY
          test "$code" -eq 0
      # Workflow logs are not always reachable from every environment, so mirror
      # failure output into job annotations, which are available via the API.
      - name: Surface logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os

          def read_tail(path, count=120):
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              return lines[-count:]

          chunks = []
          for name, path in (('analyze', '/tmp/analyze.log'),
                             ('test', '/tmp/test.log')):
              lines = read_tail(path)
              if not lines:
                  continue
              chunk, size = [], 0
              for line in lines:
                  if size + len(line) > 2500:
                      chunks.append((name, chunk)); chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append((name, chunk))

          if not chunks:
              print('::error title=no-logs::no analyze/test log was produced')
          for name, c in chunks[-10:]:
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title={name}-log::{msg}')
          PY
