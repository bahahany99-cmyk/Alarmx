name: Analyze and Test

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        # NOTE: shards are capped at 2. The Phase 3 widget tests each pump a
        # full MaterialApp over a real in-memory Drift stack, which is heavy;
        # two shards keep CI load reasonable while still running every test.
        run: |
          set -o pipefail
          flutter test --concurrency=2 2>&1 | tee /tmp/test.log
      # Workflow logs are not always reachable from every environment, so mirror
      # failure output into job annotations, which are available via the API.
      - name: Surface logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os

          def read_tail(path, count=120):
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              return lines[-count:]

          def read_failures(path, limit=80):
              """Failure lines with a little context: the tail rarely shows
              which test failed, so pull the [E]/exception/assertion lines
              out of the full log."""
              import re
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              marker = re.compile(
                  r'\[E\]|EXCEPTION CAUGHT|Test failed|Expected:|Actual:|'
                  r'Which:|The test description was:|'
                  r'[Ss]ome tests failed|\+[0-9]+ -[0-9]+.*: .*: .+')
              out, seen = [], set()
              for i, line in enumerate(lines):
                  if not marker.search(line):
                      continue
                  for extra in lines[i:i + 3]:
                      if extra not in seen:
                          seen.add(extra)
                          out.append(extra)
                          if len(out) >= limit:
                              return out
              return out

          chunks = []
          for name, path in (('analyze', '/tmp/analyze.log'),
                             ('test', '/tmp/test.log')):
              lines = read_tail(path)
              if not lines:
                  continue
              chunk, size = [], 0
              for line in lines:
                  if size + len(line) > 2500:
                      chunks.append((name, chunk)); chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append((name, chunk))

          failures = read_failures('/tmp/test.log')
          if failures:
              chunk, size = [], 0
              for line in failures:
                  if size + len(line) > 2500:
                      chunks.append(('test-failures', chunk))
                      chunk, size = [], 0
                  chunk.append(line); size += len(line) + 1
              if chunk:
                  chunks.append(('test-failures', chunk))

          if not chunks:
              print('::error title=no-logs::no analyze/test log was produced')
          for name, c in chunks[-10:]:
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in c)
              print(f'::error title={name}-log::{msg}')
          PY
